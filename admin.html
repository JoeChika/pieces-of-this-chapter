<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guestbook Admin | Pieces of This Chapter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh}.admin{padding:60px 0}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:35px}.admin-head h1{font-size:clamp(38px,8vw,65px)}.panel{background:var(--cream);border:1px solid var(--line);padding:25px;margin-bottom:20px}.login{max-width:480px;margin:12vh auto}.login input{margin:10px 0 15px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.message-row{display:grid;grid-template-columns:1fr auto;gap:15px;border-top:1px solid var(--line);padding:20px 0}.message-row:first-child{border-top:0}.message-row h3{font-family:'Playfair Display',serif;margin:0 0 4px}.meta{font-size:11px;color:var(--muted)}.message-text{margin-top:10px}.delete{border:1px solid #b36b5e;background:transparent;color:#9a5b4f;border-radius:999px;padding:9px 14px;cursor:pointer;height:max-content}@media(max-width:600px){.admin-head{display:block}.message-row{grid-template-columns:1fr}.delete{width:max-content}}</style></head><body><main class="section-shell admin"><section id="login" class="panel login"><div class="section-label">PRIVATE AREA</div><h1>Guestbook admin</h1><p class="muted">Enter your admin secret to manage submitted pieces.</p><input id="secret" type="password" placeholder="Admin secret" autocomplete="current-password"><button class="button primary full" id="loginBtn">Open dashboard</button><p id="loginError" class="copy-status"></p></section><section id="dashboard" hidden><div class="admin-head"><div><div class="section-label">PIECES OF THIS CHAPTER</div><h1>Memory wall control room.</h1><p class="muted">Review and remove messages from the public guestbook.</p></div><button class="button secondary" id="logout">Lock dashboard</button></div><div class="toolbar"><div class="panel" style="margin:0"><strong id="count">0</strong><div class="meta">published pieces</div></div></div><section class="panel"><div id="messages"></div><p id="empty" class="empty-state">No messages yet.</p></section></section></main><script>const API='/api/messages';let secret='';const $=s=>document.querySelector(s);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const r=await fetch(API,{cache:'no-store',headers:{'X-Admin-Secret':secret}});if(!r.ok)throw new Error('Could not load messages');const data=await r.json();$('#count').textContent=data.length;$('#empty').style.display=data.length?'none':'block';$('#messages').innerHTML=data.map(m=>`<article class="message-row"><div><h3>${esc(m.mood||'💌')} ${esc(m.name)}</h3><div class="meta">${esc(m.relation)} · ${esc(m.date)}</div><div class="message-text">${esc(m.message)}</div></div><button class="delete" data-id="${m.id}">Delete</button></article>`).join('');document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>removeMessage(b.dataset.id))}async function removeMessage(id){if(!confirm('Delete this piece permanently?'))return;const r=await fetch(API+'?id='+encodeURIComponent(id),{method:'DELETE',headers:{'X-Admin-Secret':secret}});if(!r.ok){alert('Could not delete this message. Check your admin secret.');return}load()}$('#loginBtn').onclick=async()=>{secret=$('#secret').value.trim();if(!secret)return;try{await load();$('#login').hidden=true;$('#dashboard').hidden=false}catch(e){$('#loginError').textContent='Could not open the dashboard. Check the deployment and API.'}};$('#logout').onclick=()=>{secret='';$('#dashboard').hidden=true;$('#login').hidden=false;$('#secret').value=''};</script></body></html>
